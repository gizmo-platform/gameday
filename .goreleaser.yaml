project_name: gameday
version: 2
before:
  hooks:
    - go mod tidy
    - go generate ./...
builds:
  - goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - '-s -w'
      - '-X github.com/gizmo-platform/gameday/pkg/buildinfo.Version={{.Version}}'
      - '-X github.com/gizmo-platform/gameday/pkg/buildinfo.Commit={{.Commit}}'
      - '-X github.com/gizmo-platform/gameday/pkg/buildinfo.BuildDate={{.Date}}'

archives:
  - formats: ['tar.gz']
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats: ['zip']
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
