---
Field:
  Positions:
    - Name: red
      ID: 1
      Color1: ec5e5e
      Color2: f4a2a2
    - Name: blue
      ID: 2
      Color1: 5b7ab6
      Color2: 9fb1d4
    - Name: green
      ID: 3
      Color1: 8de98d
      Color2: bef3be
    - Name: yellow
      ID: 4
      Color1: f5f551
      Color2: fcfcd3

Game:
  Phases:
    - Name: seeding
      ID: 1
      ScoreSummation: AverageWithMulligan
      ScheduleType: RandomSeeding
    - Name: semifinal
      ID: 2
      ScoreSummation: Total
      DivisionAware: true
      ScheduleType: BESTSemifinal
      AdvancementFilters:
        - Rule: PickTop8
          Filter: ScoreboardRanking
          Mode: include
          SelectFrom: 1
          SliceExpr: 8
    - Name: finals
      ID: 3
      ScoreSummation: Total
      DivisionAware: true
      ScheduleType: BESTFinals
      TieBreaker: BESTUnifiedTieBreaker
      AdvancementFilters:
        - Rule: PickTop4
          Filter: ScoreboardRanking
          Mode: include
          SelectFrom: 2
          SliceExpr: 4

  Elements:
    - ID: 1
      EID: factoids
      Name: Net True Factoids
      Desc: Scores as count completed.
      Type: count
      States:
        - ID: 1
          SID: collected
          Name: Collected
          Desc: Resting on the robot.
          Each: 10
        - ID: 2
          SID: sorted
          Name: Sorted
          Desc: Inside the True sorting tray.
          Each: 5
    - ID: 2
      EID: loc_factoids
      Name: LOC Factoids
      Desc: All-or-nothing flags.
      Type: boolean
      States:
        - ID: 3
          SID: white
          Name: White LOC Factoid
          Desc: Any legal scoring position.
          Each: 100
        - ID: 4
          SID: gold
          Name: Golden LOC Factoid
          Desc: Any legal scoring position.
          Each: 100
    - ID: 3
      EID: wsd_gate_latch
      Name: WSD Gate Latch
      Desc: Exactly one value chosen.
      Type: radio
      States:
        - ID: 5
          SID: released
          Name: Latches Released
          Values:
            - ID: 1
              VID: none
              Name: None Released
              Points: 0
              Default: true
            - ID: 2
              VID: one_released
              Name: 1 Released
              Points: 100
            - ID: 3
              VID: two_released
              Name: 2 Released
              Points: 130
